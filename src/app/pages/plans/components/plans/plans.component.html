<div class="container-fluid">
  <app-page-title
    title="Plans"
    [breadcrumbItems]="breadCrumbItems"
  ></app-page-title>

  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <div class="row mb-2">
            <div class="col-sm-4">
              <div class="search-box me-2 mb-2 d-inline-block">
                <div class="position-relative">
                  <input
                    type="text"
                    class="form-control"
                    id="searchTableList"
                    placeholder="Search..."
                    [(ngModel)]="term"
                    (ngModelChange)="search()"
                  />
                  <i class="bx bx-search-alt search-icon"></i>
                </div>
              </div>
            </div>
            <div class="col-sm-8">
              <div class="text-sm-end">
                <button
                  type="button"
                  data-bs-toggle="modal"
                  [routerLink]="['/tenant/add-edit']"
                  class="btn btn-success btn-rounded waves-effect waves-light addContact-modal mb-2"
                >
                  <i class="mdi mdi-plus me-1"></i> Add New
                </button>
              </div>
            </div>
            <!-- end col-->
          </div>
          <!-- end row -->
          <!-- plans.component.html -->
          <div *ngIf="loading">Loading plans...</div>
          <div *ngIf="error">{{ error }}</div>

          <section class="pricing-plans text-center">
            <div class="container">
              <div class="row justify-content-md-center">
                <div class="col-sm-12 col-md-8 col-md-offset-2">
                  <h1 class="section-title">Pricing Plans</h1>
                  <p class="lead">
                    Our cloud hosting plans are designed for companies of all
                    sizes.
                  </p>
                </div>
              </div>
              <div class="row">
                @for(plan of plans;track $index){
                <div class="col-md-4 animated">
                  <div class="card pricing-box rounded">
                    <div class="card-block">
                      <h4 class="card-title">
                        {{ plan.name }}
                      </h4>
                      <h6 class="card-text">
                        <sup class="currency"> $ </sup>
                        <span class="amount">
                          {{ plan.price }}
                        </span>
                        <span class="month"> / mo </span>
                      </h6>
                    </div>
                    <ul class="list-group list-group-flush">
                      @for(feature of plan.features;track $index){
                      <li class="list-group-item text-center d-inline-block">
                        {{ feature.content }}
                      </li>
                      }
                    </ul>
                    <div class="card-block">
                      <a
                        href="#"
                        class="btn btn-outline-start"
                        title="Get Started"
                      >
                        Get Started
                      </a>
                    </div>
                  </div>
                </div>
                }
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- removeItemModal -->
<div
  bsModal
  #removeItemModal="bs-modal"
  class="modal fade"
  id="removeItemModal"
  tabindex="-1"
  aria-hidden="true"
>
  <platx-confirm-model
    [title]="'Are you sure you want to remove this row?'"
    (confirm)="confirmDelete(deleteId)"
    (cancel)="removeItemModal.hide()"
  />
</div>
<!-- end removeItemModal -->

<!-- removeItemModal -->
<div
  bsModal
  #confirmModal="bs-modal"
  class="modal fade"
  id="confirmModal"
  tabindex="-1"
  aria-hidden="true"
>
  <platx-confirm-model
    [title]="'Are you sure you want to Cange Status?'"
    (confirm)="confirmActivation()"
    (cancel)="confirmModal.hide()"
  />
</div>
<!-- end confirmModal -->
