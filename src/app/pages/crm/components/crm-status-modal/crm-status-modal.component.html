<div bsModal #modal="bs-modal" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" *ngIf="lead">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">{{ 'CRM.STATUS_MODAL.TITLE' | translate }}</h5>
          <small class="text-muted">{{ lead.name }} · {{ 'CRM.STATUS_MODAL.CURRENTLY' | translate }} <strong>{{ label(lead.status) | translate }}</strong></small>
        </div>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">{{ 'CRM.STATUS_MODAL.NEW_STATUS' | translate }}</label>
          <select class="form-select" [(ngModel)]="model.status" name="status">
            @for (s of statuses; track s.value) {
            <option [ngValue]="s.value">{{ s.label | translate }}</option>
            }
          </select>
        </div>

        <div class="mb-3" *ngIf="isLost">
          <label class="form-label">{{ 'CRM.STATUS_MODAL.LOST_REASON' | translate }}</label>
          <input type="text" class="form-control" [(ngModel)]="model.lostReason" name="lostReason"
            [placeholder]="'CRM.STATUS_MODAL.LOST_REASON_PLACEHOLDER' | translate" maxlength="500" />
        </div>

        <div class="mb-3" *ngIf="!isClosed">
          <label class="form-label">{{ 'CRM.LEAD_FORM.NEXT_FOLLOWUP' | translate }}</label>
          <input type="datetime-local" class="form-control" [(ngModel)]="model.nextFollowUpAt" name="nextFollowUpAt" />
          <div class="form-hint mt-1">{{ 'CRM.STATUS_MODAL.KEEP_CURRENT' | translate }}</div>
        </div>

        <div class="mb-0">
          <label class="form-label">{{ 'CRM.STATUS_MODAL.NOTE' | translate }}</label>
          <textarea class="form-control" rows="3" [(ngModel)]="model.note" name="note" maxlength="2000"
            [placeholder]="'CRM.STATUS_MODAL.NOTE_PLACEHOLDER' | translate"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-light" (click)="close()">{{ 'COMMON.CANCEL' | translate }}</button>
        <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
          {{ 'CRM.STATUS_MODAL.UPDATE' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
