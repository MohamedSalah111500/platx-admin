<div class="container-fluid">
  <app-page-title title="Tenant Subscription" [breadcrumbItems]="breadCrumbItems"></app-page-title>

  <!-- Tenant header -->
  <div class="card tenant-header" *ngIf="tenant">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="tenant-avatar">
          <i class="mdi mdi-domain"></i>
        </div>
        <div>
          <h5 class="mb-1 fw-bold">{{ tenant.title }}</h5>
          <div class="text-muted font-size-13">
            <span>{{ tenant.domain }}</span>
            <span class="mx-2">·</span>
            <span>{{ tenant.email }}</span>
          </div>
        </div>
      </div>
      <button class="btn btn-light back-btn" (click)="back()">
        <i class="mdi mdi-arrow-left me-1"></i> Back to tenants
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Subscription section -->
  <platx-tenant-subscription-section
    *ngIf="tenantId && !loading"
    [tenantId]="tenantId"
  ></platx-tenant-subscription-section>

  <!-- Installments section -->
  <div class="mt-4" *ngIf="tenantId && !loading">
    <platx-tenant-installments-section [tenantId]="tenantId"></platx-tenant-installments-section>
  </div>
</div>
