<div class="modal-dialog modal-dialog-centered modal-sm">
  <div class="modal-content">
    <div class="modal-body p-4 text-center">
      <img [src]="imagePath" alt="" *ngIf="imagePath" class="img-fluid mb-3" />
      <p class="text-muted font-size-16 mb-4">{{ title }}</p>

      <div class="hstack gap-2 justify-content-center mb-0">
        <button type="button" class="btn btn-primary" [disabled]="busy" (click)="onConfirm()">
          <span *ngIf="busy" class="spinner-border spinner-border-sm me-1"></span>
          {{ confirmLabel | translate }}
        </button>
        <button type="button" class="btn btn-light" [disabled]="busy" (click)="onCancel()">
          {{ "COMMON.CANCEL" | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
