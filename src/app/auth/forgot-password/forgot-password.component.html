<div class="account-pages my-5 pt-sm-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card overflow-hidden">
          <div class="bg-primary-subtle">
            <div class="row">
              <div class="col-7">
                <div class="text-primary p-4">
                  <h5 class="text-primary">{{ "AUTH.FORGOT.TITLE" | translate }}</h5>
                  <p>{{ "AUTH.FORGOT.SUBTITLE_" + step.toUpperCase() | translate }}</p>
                </div>
              </div>
              <div class="col-5 align-self-end">
                <img src="assets/images/profile-img.png" alt="" class="img-fluid" />
              </div>
            </div>
          </div>
          <div class="card-body pt-0">
            <div class="avatar-md profile-user-wid mb-4">
              <span class="avatar-title rounded-circle bg-light">
                <img src="assets/images/logo-icon-color.png" alt="" class="rounded-circle" height="50" />
              </span>
            </div>
            <div class="text-center mb-3">
              <platx-env-switcher variant="chip"></platx-env-switcher>
            </div>
            <div class="p-2">
              @if (error) {
                <alert type="danger" [dismissible]="false">{{ error }}</alert>
              }

              @switch (step) {
                @case ("email") {
                  <form (ngSubmit)="sendCode()">
                    <div class="mb-3">
                      <label for="email">{{ "AUTH.FORGOT.EMAIL" | translate }}</label>
                      <input type="email" id="email" class="form-control" autocomplete="username"
                        [formControl]="emailControl" [placeholder]="'AUTH.FORGOT.EMAIL' | translate" />
                    </div>
                    <div class="d-grid">
                      <button class="btn btn-primary" type="submit" [disabled]="loading || emailControl.invalid">
                        @if (loading) {
                          <span class="spinner-border spinner-border-sm me-1"></span>
                        }
                        {{ "AUTH.FORGOT.SEND_CODE" | translate }}
                      </button>
                    </div>
                  </form>
                }
                @case ("code") {
                  <form (ngSubmit)="verifyCode()">
                    <div class="mb-3">
                      <label for="code">{{ "AUTH.FORGOT.CODE" | translate }}</label>
                      <input type="text" id="code" class="form-control text-center" inputmode="numeric"
                        autocomplete="one-time-code" maxlength="6" [formControl]="codeControl" />
                    </div>
                    <div class="d-grid gap-2">
                      <button class="btn btn-primary" type="submit" [disabled]="loading || codeControl.invalid">
                        @if (loading) {
                          <span class="spinner-border spinner-border-sm me-1"></span>
                        }
                        {{ "AUTH.FORGOT.VERIFY" | translate }}
                      </button>
                      <button class="btn btn-light" type="button" [disabled]="loading" (click)="sendCode()">
                        {{ "AUTH.FORGOT.RESEND" | translate }}
                      </button>
                    </div>
                  </form>
                }
                @case ("password") {
                  <form [formGroup]="passwordForm" (ngSubmit)="resetPassword()">
                    <div class="mb-3">
                      <label for="password">{{ "AUTH.FORGOT.NEW_PASSWORD" | translate }}</label>
                      <div class="input-group auth-pass-inputgroup">
                        <input [type]="fieldTextType ? 'text' : 'password'" id="password" class="form-control"
                          formControlName="password" autocomplete="new-password" />
                        <button class="btn btn-light ms-0" type="button"
                          [attr.aria-label]="(fieldTextType ? 'AUTH.HIDE_PASSWORD' : 'AUTH.SHOW_PASSWORD') | translate"
                          (click)="fieldTextType = !fieldTextType">
                          <i class="mdi" [ngClass]="fieldTextType ? 'mdi-eye-outline' : 'mdi-eye-off-outline'"></i>
                        </button>
                      </div>
                    </div>
                    <div class="mb-3">
                      <label for="confirmPassword">{{ "AUTH.FORGOT.CONFIRM_PASSWORD" | translate }}</label>
                      <input [type]="fieldTextType ? 'text' : 'password'" id="confirmPassword" class="form-control"
                        formControlName="confirmPassword" autocomplete="new-password" />
                    </div>
                    <div class="d-grid">
                      <button class="btn btn-primary" type="submit" [disabled]="loading || passwordForm.invalid">
                        @if (loading) {
                          <span class="spinner-border spinner-border-sm me-1"></span>
                        }
                        {{ "AUTH.FORGOT.SAVE" | translate }}
                      </button>
                    </div>
                  </form>
                }
              }

              <div class="mt-4 text-center">
                <a routerLink="/auth/login" class="text-muted">{{ "AUTH.FORGOT.BACK_TO_LOGIN" | translate }}</a>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-5 text-center">
          <p>&#169; {{ year }} PlatX</p>
        </div>
      </div>
    </div>
  </div>
</div>
