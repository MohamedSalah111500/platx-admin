<div id="layout-wrapper" [class.has-testing-banner]="apiEnv.isTesting">

  <div class="env-banner env-banner-testing" *ngIf="apiEnv.isTesting">
    <i class="mdi mdi-flask-outline me-2"></i>
    <strong>{{ "HEADER.TESTING_ENV" | translate }}</strong>
    <span class="env-banner-sep">·</span>
    <span>{{ "HEADER.TESTING_ENV_HINT" | translate }}</span>
  </div>

  <app-topbar (mobileMenuButtonClicked)="onToggleMobileMenu()"></app-topbar>

  <app-sidebar></app-sidebar>

  <div class="main-content">
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>
  </div>
</div>
