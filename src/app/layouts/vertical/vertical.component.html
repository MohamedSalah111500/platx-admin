<div id="layout-wrapper" [class.has-testing-banner]="apiEnv.isTesting">

  <!-- Testing-mode banner (only visible when targeting the testing API) -->
  <div class="env-banner env-banner-testing" *ngIf="apiEnv.isTesting">
    <i class="mdi mdi-flask-outline me-2"></i>
    <strong>TESTING ENVIRONMENT</strong>
    <span class="env-banner-sep">·</span>
    <span>You are viewing data from the test API. Changes will not affect production.</span>
  </div>

  <app-topbar (settingsButtonClicked)="onSettingsButtonClicked()" (mobileMenuButtonClicked)="onToggleMobileMenu()">
  </app-topbar>

  <app-sidebar></app-sidebar>

  <div class="main-content">
    <div class="page-content">
      <!-- content -->
      <router-outlet></router-outlet>
    </div>

    <!-- footer -->
    <app-footer></app-footer>
  </div>
</div>

<app-rightsidebar></app-rightsidebar>
