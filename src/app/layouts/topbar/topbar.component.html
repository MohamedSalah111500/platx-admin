<header id="page-topbar">
  <div class="navbar-header position-relative">
    <div class="topbar-env-center">
      <platx-env-switcher variant="chip"></platx-env-switcher>
    </div>

    <div class="d-flex">
      <div class="navbar-brand-box">
        <a routerLink="/" class="logo logo-dark">
          <span class="logo-sm">
            <img src="assets/images/logo.svg" alt="" height="30" />
          </span>
          <span class="logo-lg">
            <img src="assets/images/logo-color.png" alt="" height="30" />
          </span>
        </a>

        <a routerLink="/" class="logo logo-light">
          <span class="logo-sm">
            <img src="assets/images/logo-light.svg" alt="" height="30" />
          </span>
          <span class="logo-lg">
            <img src="assets/images/logo-color-white.png" alt="" height="30" />
          </span>
        </a>
      </div>

      <button
        type="button"
        class="btn btn-sm px-3 font-size-16 header-item"
        [ngClass]="{ 'd-none': theme === 'horizontal' }"
        id="vertical-menu-btn"
        (click)="toggleMobileMenu($event)">
        <i class="fa fa-fw fa-bars"></i>
      </button>
    </div>

    <div class="d-flex">
      <div class="dropdown d-inline-block" dropdown>
        <button
          type="button"
          class="btn header-item"
          id="page-header-lang-dropdown"
          [attr.aria-label]="'HEADER.LANGUAGE' | translate"
          dropdownToggle>
          <img [src]="flagvalue === undefined ? valueset : flagvalue" alt="" height="16" />
        </button>
        <div class="dropdown-menu dropdown-menu-end" *dropdownMenu>
          @for (item of listLang; track item.lang) {
          <a
            href="javascript:void(0);"
            class="dropdown-item notify-item"
            (click)="setLanguage(item.text, item.lang, item.flag)"
            [ngClass]="{ active: cookieValue === item.lang }">
            <img [src]="item.flag" alt="" class="me-1" height="12" />
            <span class="align-middle">{{ item.text }}</span>
          </a>
          }
        </div>
      </div>

      <div class="dropdown d-none d-lg-inline-block ms-1">
        <button
          type="button"
          class="btn header-item noti-icon waves-effect"
          [attr.aria-label]="'HEADER.FULLSCREEN' | translate"
          (click)="fullscreen()">
          <i class="bx bx-fullscreen"></i>
        </button>
      </div>

      <div class="dropdown d-inline-block" dropdown>
        <button type="button" class="btn header-item" dropdownToggle id="page-header-user-dropdown">
          <span class="header-profile-initials rounded-circle">{{ userInitials }}</span>
          <span class="d-none d-xl-inline-block ms-1">{{ user.firstName }} {{ user.lastName }}</span>
          <i class="mdi mdi-chevron-down d-none d-xl-inline-block"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end" *dropdownMenu>
          <a class="dropdown-item text-danger" href="javascript: void(0);" (click)="logout()">
            <i class="bx bx-power-off font-size-16 align-middle me-1 text-danger"></i>
            {{ "HEADER.LOGIN.LOGOUT" | translate }}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
